[project]
name = "fin-c2-064"
version = "0.1.0"
description = "RealTimeTransactionFraudDetectionAlertAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry by the test job in CI. Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
# pyyaml is a real runtime dependency: the entry point reads config/config.yaml
# to pick up the declared runtime parameters, and the boundary tests read it to
# check the interrupt contract.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20240311",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/examples/"]
# The published framework wheel ships no py.typed marker, so framework.* and
# shared.* imports resolve to Any — which turns every required framework
# subclass into an untyped-import / subclass-of-Any error. Every other strict
# setting stays on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*"]
ignore_missing_imports = true

# State extends the framework's AgentState TypedDict. That is correct at
# runtime, but the untyped wheel makes AgentState resolve to Any, so mypy cannot
# see the TypedDict base and mis-flags every field. Silence only that
# diagnostic, and only for this module: the errors all have the one cause.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
